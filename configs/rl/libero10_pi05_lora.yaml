# Grader-in-the-loop PPO (piRL Flow-SDE, RLinf) for pi0.5 on LIBERO-10, LoRA on the action expert, one RTX 5090.
# Based on RLinf's examples/embodiment/config/libero_10_ppo_openpi_pi05.yaml; differences are marked "ours".
# Launch: scripts/rl/run_rl.sh <run_name> [hydra overrides...]  (e.g. sip.grader.name=oracle)

defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer   # ours (patch_syncer): keeps no GPU state between syncs
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# ours: run bookkeeping, grader, stopping rule
sip:
  repo: ${oc.env:SIP_REPO}
  run_name: test
  run_dir: ${sip.repo}/outputs/rl/runs/${sip.run_name}
  episode_dir: ${sip.run_dir}/episodes
  grader_name: oracle       # which entry of sip.graders labels the episodes
  graders:
    oracle:                 # LIBERO's own success check (0/1)
      name: oracle
      reward: label
    flip:                   # control: oracle labels flipped at random (set fpr / fnr from a grader's audit)
      name: flip
      reward: label
      fpr: 0.0
      fnr: 0.0
      seed: 0
    robometer:              # Robometer-4B; reward = 1 if final-frame success probability > threshold
      name: robometer
      reward: label
      persistent: true      # model stays in CPU RAM between iterations, on the GPU only while grading
      python: third_party/robometer/.venv/bin/python
      script: scripts/rl/graders/robometer_grade.py
      cwd: outputs/rl/grader_cwd
      args:
        model: ${sip.repo}/checkpoints/Robometer-4B-infer
        max_frames: 8
        threshold: 0.5
        batch_size: 4       # 16 ran out of GPU memory next to the 16 env renderers (peak 12.7 GiB); halves on OOM
    robometer_soft:         # Robometer-4B; reward = final-frame success probability itself
      name: robometer
      reward: score
      persistent: true
      python: third_party/robometer/.venv/bin/python
      script: scripts/rl/graders/robometer_grade.py
      cwd: outputs/rl/grader_cwd
      args:
        model: ${sip.repo}/checkpoints/Robometer-4B-infer
        max_frames: 8
        threshold: 0.5      # only for the agreement metrics; the reward is the probability
        batch_size: 4
  min_gpu_hours: 12.0       # stop only when BOTH minimums are reached ...
  min_episodes: 3840        # ... (32 iterations; the 12 GPU-h minimum binds first, at ~55 iterations)
  max_gpu_hours: 24.0       # ... or at this cap
  snapshot_every_episodes: 480    # evaluation snapshots (small) at equal episode counts across runs ...
  snapshot_at_gpu_hours: [12.0]   # ... and when crossing these GPU-hour marks (equal-compute comparison)
  num_gpus: 1
  video_fps: 2              # frames are action-chunk boundaries (every 10 sim steps = 0.5 s)
  critic_warmup_iterations: 2   # value head only (actor lr 0) until the critic has seen 240 episodes
  pause_at_episodes: 0      # >0: checkpoint and exit there without finishing the run (pilot check)

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${sip.run_dir}/rlinf
    project_name: sip
    experiment_name: ${sip.run_name}
    logger_backends: ["tensorboard"]
  max_epochs: 100000        # ours: the sip stopping rule ends the run
  max_steps: -1
  only_eval: False
  val_check_interval: -1    # ours: evaluation runs afterwards on the official LIBERO layouts
  save_interval: -1         # ours: checkpoints on a GPU-hour schedule (sip.ckpt_every_gpu_hours)
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1           # ours (4): each batch is used once; 4 passes over 32 episodes overfit their noise
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 10         # ours (64 envs x 8 in piRL): 12 x 10 = 120 episodes per iteration
    total_num_envs: 12        # ours: RAM; each LIBERO env process takes ~2.9 GB (16 left too little for the grader)
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    skip_intermediate_renders: True
    ignore_terminations: True   # ours: fixed-length episodes; the simulator never ends an episode early
    auto_reset: False
    video_cfg:
      save_video: False
  eval:                         # unused during training (val_check_interval=-1)
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True          # ours: actor and rollout share one GPU
  pipeline_stage_num: 1
  model:
    model_path: ${sip.repo}/checkpoints/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16          # ours (128): memory; 32 ran out of GPU memory in iteration 4 (peak ~30.4 of 31.3 GiB)
  global_batch_size: 480        # ours (2048): 120 episodes x 48 chunk steps = 5760 samples -> 12 optimizer steps
  seed: 42
  enable_offload: True
  model:
    model_path: ${sip.repo}/checkpoints/RLinf-Pi05-LIBERO-SFT
    model_type: "openpi"
    add_value_head: True
    expert_lora_rank: 32        # ours: LoRA on the action expert (sip_rl/expert_lora.py), VLM frozen
    head_lr_scale: 0.5          # ours: full-rank action/time heads at lr 5e-6 (piRL's full-expert lr)
    openpi:
      task: rl
      value_after_vlm: True
  optim:
    lr: 1.0e-5                  # ours (5e-6 full expert): LoRA
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    save_full_model_weights: False  # ours: resume reads only the DCP checkpoint; the extra full copy cost ~6 GB RAM + disk
    use_orig_params: True       # ours: LoRA mixes trainable and frozen tensors inside modules
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False
critic:
  use_critic_model: False
